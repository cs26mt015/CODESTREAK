[alembic]
script_location = backend/alembic
prepend_sys_path = .
sqlalchemy.url = mysql+pymysql://codestreak_user:change_me@localhost:3306/codestreak

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
stream = ext://sys.stderr

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
