services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-codestreak}
      MYSQL_USER: ${MYSQL_USER:-codestreak_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-codestreak_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-codestreak_root_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8000
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER:-codestreak_user}:${MYSQL_PASSWORD:-codestreak_dev_password}@db:3306/${MYSQL_DATABASE:-codestreak}"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1::8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: