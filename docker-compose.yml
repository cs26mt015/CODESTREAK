services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-asdl}
      MYSQL_USER: ${MYSQL_USER:-asdl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-asdl}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-asdl-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    build:
      context: ./backend
    pull_policy: build
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-ASDL API}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-asdl}:${MYSQL_PASSWORD:-asdl}@db:3306/${MYSQL_DATABASE:-asdl}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql-data:
